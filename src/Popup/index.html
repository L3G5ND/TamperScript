<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <!--<link href="./style.css" rel="stylesheet" type="text/css"/>-->
        <link href="css/main.css" rel="stylesheet" type="text/css"/>
        <link href="css/style.css" rel="stylesheet" type="text/css"/>
        <link href="css/home.css" rel="stylesheet" type="text/css"/>
        <link href="css/script-editor.css" rel="stylesheet" type="text/css"/>
        <link href="css/settings.css" rel="stylesheet" type="text/css"/>
    </head>
    <body>
        <div class="root">
            <div class="header">
                <span class="header-text">TamperScript</span>
            </div>
            <div class="content">
                <div class="content-page home-page">
                    <div class="navigation-bar">

                    </div>
                    <div class="script-tabs">
                        <div class="script-tab">
                            <label class="script-toggle switch">
                                <input type="checkbox">
                                <span class="slider"></span>
                            </label>
                            <span class="script-name">Test Script</span>
                            <button class="script-edit-button">
                                <img src="images/edit-script-icon.png">
                            </button>
                        </div>
                    </div>
                </div>
                <div class="content-page script-editor-page">
                    <div class="script-editor-menu-bar">
                        <button class="file-tab menu-bar-tab">
                            <span>File</span>
                            <div class="tab-content"></div>
                        </button>
                        <button class="settings-tab menu-bar-tab">
                            <span>Settings</span>
                            <div class="tab-content"></div>
                        </button>
                        <button class="help-tab menu-bar-tab">
                            <span>Help</span>
                            <div class="tab-content"></div>
                        </button>
                    </div>
                    <textarea class="script-editor"></textarea>
                </div>
                <div class="content-page settings-page">
                    
                </div>
            </div>
            <div class="footer">
                <div class="navigation-bar">
                    <div class="navigation-tab">
                        <img src="images/home-icon.png">
                        <div class="navigation-underline"></div>
                    </div>
                    <div class="navigation-tab">
                        <img src="images/script-editor-icon.png">
                        <div class="navigation-underline"></div>
                    </div>
                    <div class="navigation-tab">
                        <img src="images/settings-icon.png">
                        <div class="navigation-underline"></div>
                    </div>
                </div>
            </div>
        </div>
        <!--<script src="js/main.js"></script>-->
    </body>
</html>
